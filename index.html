<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b2033;--mu:#667;--bd:#e3e6ef;--pr:#3d4fd6;--prs:#e8ebff;--ok:#1f9d63;--wa:#c78a0a;--er:#d6455b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme=light]){}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1220;--card:#181c2e;--tx:#e8eaf5;--mu:#9aa0bd;--bd:#2a2f47;--pr:#8c9bff;--prs:#23294d}}

*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Manrope,Inter,system-ui,sans-serif}
#app{display:flex;min-height:100%}nav.side{width:220px;padding:18px 12px;border-right:1px solid var(--bd);background:var(--card);position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:800;font-size:17px;padding:4px 10px 14px}.logo span{color:var(--pr)}
nav a{display:flex;gap:10px;padding:9px 12px;border-radius:10px;color:var(--mu);cursor:pointer;font-weight:600;transition:.15s}nav a:hover{background:var(--prs)}nav a.on{background:var(--prs);color:var(--pr)}

.g{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

.big{font-size:26px;font-weight:800}.now{background:#1d2766;color:#fff;border:0}.now .mu{color:#dfe3ff}
button,select,input,textarea{font:inherit;color:var(--tx)}button{background:var(--pr);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.12s}button:hover{filter:brightness(1.1)}button.s{background:var(--prs);color:var(--pr)}button.x{background:transparent;color:var(--mu);padding:4px 8px}
.now button{background:#fff;color:#2a37a8}input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;max-width:100%}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}.CRITICAL{background:#fde3e7;color:var(--er)}.HIGH{background:#fff0d4;color:var(--wa)}.MEDIUM{background:var(--prs);color:var(--pr)}.LOW{background:#e1f5ec;color:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.bar{height:7px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);transition:width .4s}
.tl{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd)}.tl.cur{background:var(--prs);margin:0 -8px;padding:8px;border-radius:9px}.tl.done{opacity:.5;text-decoration:line-through}.tm{width:96px;color:var(--mu);font-size:13px;flex:none}
.k-class{border-left:4px solid var(--pr)}.k-focus{border-left:4px solid var(--ok)}.k-prayer{border-left:4px solid #8a5cd6}.k-meal{border-left:4px solid var(--wa)}.k-gym{border-left:4px solid var(--er)}.k-rest{border-left:4px solid #8aa}
.tl>div:last-child{flex:1;padding-left:8px}.tm2{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.ph{display:flex;gap:4px}.ph div{flex:1;text-align:center;font-size:11px;padding:8px 2px;border-radius:8px;background:var(--bd)}.ph .on{background:var(--pr);color:#fff;font-weight:700}
#toast{position:fixed;bottom:80px;right:20px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none}#toast.s{opacity:1}
#bn{display:none}
@media(max-width:800px){nav.side{display:none}main{padding:14px 14px 90px}#bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}#bn a{flex:1;text-align:center;font-size:11px;color:var(--mu);padding:4px;cursor:pointer}#bn a.on{color:var(--pr);font-weight:700}#bn b{display:block;font-size:18px}}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}nav a{align-items:center}.logo{display:flex;align-items:center;gap:8px;letter-spacing:-.3px}.logo .ic{color:var(--pr)}
#pal{position:fixed;inset:0;background:rgba(10,12,25,.45);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;z-index:20}.pb{background:var(--card);border:1px solid var(--bd);border-radius:12px;width:min(560px,92vw);padding:10px}.pb input{width:100%;margin-bottom:6px}.pi{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}.pi.on{background:var(--prs)}
#sh{position:fixed;inset:0;background:rgba(10,12,25,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--card);width:min(520px,100%);border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s}.sheet button.q{width:100%;text-align:left;margin-top:8px}
#fab{position:fixed;right:18px;bottom:24px;width:56px;height:56px;border-radius:50%;padding:0;box-shadow:0 6px 18px rgba(20,25,60,.3);z-index:6}#fab .ic{width:24px;height:24px}
@keyframes up{from{transform:translateY(30px);opacity:0}}@media(min-width:801px){#sh{align-items:center}.sheet{border-radius:14px}}
@media(max-width:800px){#fab{bottom:calc(74px + env(safe-area-inset-bottom,0px))}button,select,input:not([type=checkbox]):not([type=range]){min-height:44px}input[type=checkbox]{width:22px;height:22px}}
</style></head><body><div id="app"><nav class="side" id="side" aria-label="Main"></nav><main id="main"></main></div><div id="bn"></div><div id="toast" role="status"></div><input type="file" id="imf" accept="application/json" hidden>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),fm=m=>{m=Math.round(m);return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),dt=s=>new Date(s+'T00:00'),today=()=>key(new Date()),nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const dd=(a,b)=>Math.round((dt(b)-dt(a))/864e5),addD=(k,n)=>{const d=dt(k);d.setDate(d.getDate()+n);return key(d)},uid=()=>Math.random().toString(36).slice(2,9);
const COURSES=[{id:'web',n:'Web Technologies',code:'01535'},{id:'sad',n:'Software Architecture & Design Patterns',code:'01471'},{id:'eth',n:'Engineering Ethics',code:'02041'},{id:'mgt',n:'Engineering Management',code:'00821'}];
const CLS=[[0,480,570,'mgt','1102'],[0,880,970,'sad','3103'],[1,480,600,'eth','9405'],[1,620,760,'web','DS0208 (Lab)'],[2,480,570,'mgt','1102'],[2,880,970,'sad','3103'],[3,620,740,'web','9307']];
const cn=id=>COURSES.find(c=>c.id==id).n;
const EVT=[['2026-09-27','','Semester starts','sem'],['2026-10-04','','Registration closed','sem'],['2026-10-08','','TSF / Course description','sem'],['2026-11-01','2026-11-07','Lab midterms','exam'],['2026-11-08','2026-11-15','Midterm exams','exam'],['2026-11-15','','TPE begins','sem'],['2026-11-22','','Midterm grades deadline','sem'],['2026-11-29','2026-12-05','Pre-registration (Spring)','sem'],['2026-12-06','','No classes','hol'],['2026-12-12','','Sunday makeup (online)','sem'],['2026-12-16','','Victory Day','hol'],['2026-12-17','','Last instalment deadline','sem'],['2026-12-20','2026-12-26','Permit + Lab finals','exam'],['2026-12-25','','Christmas','hol'],['2026-12-27','2027-01-03','Final exams','exam'],['2027-01-10','','Final grade submission','sem'],['2027-01-16','','Final grades locked','sem'],['2027-01-24','','Spring 2026–27 begins','sem']];
const PH=[['2026-09-27','Foundation','found'],['2026-11-01','Midterm prep','exam'],['2026-11-16','Recovery + dev','dev'],['2026-12-20','Final exams','exam'],['2027-01-17','Post-semester','post']];
const phase=k=>{let p=PH[0];PH.forEach(x=>{if(k>=x[0])p=x});return k<PH[0][0]?['','Before semester','found']:p};
const W={found:{course:.28,thesis:.22,intern:.18,code:.17,portfolio:.08,english:.07},exam:{course:.65,thesis:.08,intern:.07,code:.07,portfolio:0,english:.05},dev:{course:.2,thesis:.25,intern:.2,code:.2,portfolio:.1,english:.05},post:{course:0,thesis:.3,intern:.25,code:.2,portfolio:.12,english:.13}};
const CAT={course:'Course study',thesis:'Thesis',intern:'Internship',code:'Coding',portfolio:'Portfolio',english:'English / IELTS'};
const EN={course:'M',thesis:'H',intern:'L',code:'H',portfolio:'H',english:'L'};
const TPL={thesis:['Read 2 papers on MOT under domain shift','Update literature matrix','Draft research-gap notes','SportsMOT baseline setup'],intern:['Tailor resume + apply to 2 roles','Interview prep: JS fundamentals','Polish LinkedIn / GitHub','Follow up on applications'],code:['JavaScript/TypeScript: learn → practice → build','Build a small feature from scratch','Node + Express API practice','React component practice'],portfolio:['Nexus API Platform: next milestone task'],english:['Speaking practice + vocabulary']};
const DEF={set:{name:'Talha',wake:420,sleep:1410,bf:30,lunch:810,dinner:1250,gym:1170,cap:7,ent:60,soc:30,target:5,pr:{Fajr:275,Dhuhr:700,Asr:900,Maghrib:1045,Isha:1125}},
tasks:[['Web Tech lab: JS DOM practice',2,'web',60,1,'H'],['Thesis: read 3 SportsMOT-related papers',5,'thesis',90,6,'H'],['Engineering Management reading',3,'mgt',45,3,'M'],['Resume tailoring for internships',4,'intern',60,2,'L'],['Nexus API: define data model',4,'portfolio',90,10,'H'],['SAD: Singleton + Factory notes',3,'sad',60,4,'M'],['IELTS speaking: 15-min recording',2,'english',20,0,'L']].map(t=>({id:uid(),title:t[0],imp:t[1],cat:t[2],dur:t[3],due:addD(today(),t[4]),en:t[5],done:false})),
apps:[{id:uid(),co:'Example Tech Ltd',pos:'Frontend Intern',url:'',st:'Wishlist',date:'',note:'Replace with a real posting'}],
thesis:['Paper reading','Literature review','Research gap','Research questions','Dataset preparation','Baseline implementation','Experiment planning','Experiments','Results','Ablation studies','Paper writing','Supervisor meeting','Feedback','Revision','Submission'].map(n=>({n,d:false})),papers:{read:0,pending:20},
prog:{web:0,sad:0,eth:0,mgt:0},habits:['7–8h sleep','6h+ focused work','Thesis','Coding','Gym','Prayer','English speaking','Limited social media','Water','Weekly review'].map(n=>({n,days:{}})),log:{},plans:{},theme:'system',notes:[]};
let S;try{S=JSON.parse(localStorage.getItem('sos1'))}catch(e){}S=S||JSON.parse(JSON.stringify(DEF));
const ob=(a,v)=>Object.fromEntries(a.map(k=>[k,v]));
S.intp=S.intp||Object.fromEntries([['HTML',60],['CSS',55],['JavaScript',45],['TypeScript',30],['React',45],['Node.js',40],['Express',35],['PHP',25],['SQL',35],['MongoDB',40],['REST API',40],['Git/GitHub',50],['Authentication',25],['Deployment',25],['DSA',25],['Technical interview',20],['HR interview',30],['Resume',40],['LinkedIn',30],['GitHub portfolio',30]]);
S.thp=S.thp||{Literature:20,Implementation:5,Experiment:0,Paper:0};
S.ielts=S.ielts||{band:6.0,target:7.0,skills:ob(['Listening','Reading','Writing','Speaking','Vocabulary','Grammar'],40),mocks:[]};
S.road=S.road||['HTML','CSS','JavaScript','TypeScript','React','Node.js','Express','Database','REST API','Authentication','Deployment','Advanced backend','Cloud / DevOps','AI automation / MLOps'].map((n,i)=>({n,p:i<2?70:i<5?40:i<7?30:0}));
S.proj=S.proj||{Nexus:ob(['Planning','UI','Frontend','Backend','Authentication','API management','Database','Testing','Deployment','Documentation'],0)};

let NOSAVE=0;const save=()=>{if(NOSAVE)return;try{localStorage.setItem('sos1',JSON.stringify(S))}catch(e){}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.className='s';setTimeout(()=>e.className='',1800)};
// ---- priority engine
const examSoon=()=>{const t=today();let m=1e9;EVT.filter(e=>e[3]=='exam').forEach(e=>{const d=dd(t,e[0]);if(d>=0&&d<m)m=d});return m};
function score(t){let s=t.imp*2,d=dd(today(),t.due||'2099-01-01');s+=d<0?10:d<=1?8:d<=3?6:d<=7?4:1;if(COURSES.some(c=>c.id==t.cat)&&examSoon()<=14)s+=3;return s}
const lvl=t=>{const s=score(t);return s>=16?'CRITICAL':s>=12?'HIGH':s>=8?'MEDIUM':'LOW'};
// ---- planner
function genPlan(k){const st=S.set,dow=dt(k).getDay(),ph=phase(k)[2],ex=ph=='exam',B=[];
 const inEvt=EVT.some(e=>e[3]=='hol'&&e[0]==k);
 const put=(s,d,t,title,cat)=>{let ok=true;while(ok){ok=false;for(const b of B){if(s<b.e+(b.t=='class'?20:0)&&s+d>b.s-(t=='class'?0:b.t=='class'?20:0)){s=b.e+(b.t=='class'?20:0)+(b.t=='class'?0:0);ok=true}}}B.push({id:uid(),s,e:s+d,t,title,cat,done:false});return s};
 if(!inEvt)CLS.filter(c=>c[0]==dow).forEach(c=>B.push({id:uid(),s:c[1],e:c[2],t:'class',title:cn(c[3]),cat:c[3],room:c[4],done:false}));
 B.push({id:uid(),s:st.sleep,e:1440,t:'rest',title:'Sleep',done:false});
 const bfs=put(st.wake+st.bf,30,'meal','Breakfast');
 Object.entries(st.pr).forEach(([n,m])=>{if(m>=st.wake&&m<st.sleep-20)put(m,20,'prayer',n)});
 put(st.lunch,45,'meal','Lunch');put(st.dinner,40,'meal','Dinner');
 const gymDay=![0,3].includes(dow);if(gymDay)put(st.gym,70,'gym','Gym');
 put(1045+30,0,'rest','');B.pop();
 const soc=ex?15:st.soc,ent=ex?30:st.ent;put(1090,soc,'rest','Social media (window)');put(st.dinner+50,ent,'rest','Entertainment / personal');
 B.sort((a,b)=>a.s-b.s);
 // gaps
 const gaps=[];let cur=st.wake+st.bf+30;const lim=st.sleep-60;
 B.filter(b=>b.title!='Sleep').forEach(b=>{const s=b.s-(b.t=='class'?15:5);if(s-cur>=45)gaps.push([cur,s]);cur=Math.max(cur,b.e+(b.t=='class'?20:5))});if(lim-cur>=45)gaps.push([cur,lim]);
 const w=W[ph]||W.found,cap=(ex?S.set.cap+1:S.set.cap)*60,used={},open=S.tasks.filter(t=>!t.done).sort((a,b)=>score(b)-score(a));let tot=0,tIdx=0;
 const nextC=()=>{for(let i=0;i<7;i++){const c=CLS.find(x=>x[0]==(dow+(i||1))%7);if(c)return c[3]}return 'web'};
 gaps.forEach(g=>{let s=g[0];while(g[1]-s>=45&&tot<cap){const after=B.some(b=>b.t=='class'&&s-b.e<=40&&s>=b.e);
   const pri=open.find(t=>!t.used&&(!after||EN[t.cat]!='H'&&t.en!='H'||false));let cat,title,tk,reason;
   if(pri&&score(pri)>=12){tk=pri;cat=COURSES.some(c=>c.id==pri.cat)?'course':pri.cat;title=pri.title;reason='High priority ('+lvl(pri)+'): due '+(pri.due||'soon')+'.'}
   else{const cs=Object.keys(w).filter(c=>w[c]>0&&(!after||EN[c]!='H')).sort((a,b)=>((used[a]||0)/(w[a]||1))-((used[b]||0)/(w[b]||1)));cat=cs[0]||'course';
    const m=open.find(t=>!t.used&&(t.cat==cat||cat=='course'&&COURSES.some(c=>c.id==t.cat)));if(m){tk=m;title=m.title}else title=cat=='course'?'Revise: '+cn(nextC()):TPL[cat][(tIdx++)%TPL[cat].length];
    reason=(ex?'Exam phase':phase(k)[1]+' phase')+': '+CAT[cat]+' keeps its weekly share.'+(after?' Lighter work after class.':'')}
   if(tk)tk.used=1;const dur=Math.min(g[1]-s,cat=='code'||cat=='thesis'?100:80,tk?Math.max(30,tk.dur):80);
   B.push({id:uid(),s,e:s+dur,t:'focus',title,cat,task:tk&&tk.id,reason,done:false});used[cat]=(used[cat]||0)+dur;tot+=dur;s+=dur+10}});
 open.forEach(t=>delete t.used);B.sort((a,b)=>a.s-b.s);return B}
const plan=k=>{if(!S.plans[k]){S.plans[k]=genPlan(k);save()}return S.plans[k]};
function nowCard(){const k=today(),P=plan(k),n=nowM();const cur=P.find(b=>b.s<=n&&n<b.e),nx=P.filter(b=>b.s>n&&b.t=='focus'&&!b.done);
 if(cur&&cur.t=='class')return{t:'In class: '+cur.title,d:cur.e-n+' min left',r:'Room '+cur.room+'. Plan resumes after class + travel buffer.',next:nx};
 const f=cur&&cur.t=='focus'&&!cur.done?cur:nx[0];if(f)return{b:f,t:f.title,d:(f.e-f.s)+' min',r:f.reason,next:nx.filter(x=>x!=f)};
 return{t:n>=S.set.sleep-60?'Wind down':'Nothing focus-critical right now',d:'',r:'Rest, eat, pray, or take a break. Use Today → Regenerate if plans changed.',next:[]}}
// ---- views
const NAV=[['dash','Overview','dash'],['today','Today','today'],['tasks','Tasks','tasks'],['cal','Calendar','cal'],['courses','Academics','courses'],['career','Internship','career'],['thesis','Thesis','thesis'],['road','Roadmap','road'],['ielts','IELTS','ielts'],['proj','Projects','proj'],['focus','Focus','focus'],['habits','Habits','habits'],['set','Settings','set']];
let V=location.hash.slice(1)||'dash',F=null,TM=null;
const nav=()=>{$('#side').innerHTML='<div class="logo">'+IC('mark')+'Talukdar<span>Activities</span></div><a data-go="pal">'+IC('search')+' Search <span class="mu">Ctrl K</span></a>'+NAV.map(n=>`<a data-go="${n[0]}" class="${V==n[0]?'on':''}" tabindex="0" role="link">${IC(n[2])} ${n[1]}</a>`).join('');
 const m=['dash','today','tasks','cal'];$('#bn').innerHTML=m.map(i=>{const n=NAV.find(x=>x[0]==i);return`<a data-go="${i}" class="${V==i?'on':''}"><b>${IC(n[2])}</b>${n[1]}</a>`}).join('')+`<a data-go="more" class="${m.includes(V)?'':'on'}"><b>${IC('menu')}</b>More</a>`};
const bar=p=>`<div class="bar" role="progressbar" aria-valuenow="${Math.round(p)}"><i style="width:${p}%"></i></div>`;
const mins=(k,c)=>Object.entries((S.log[k]||{})).reduce((a,[x,v])=>a+(c&&x!=c?0:v),0);
function dash(){const k=today(),n=nowCard(),ph=phase(k),wk=Math.max(1,Math.floor(dd(PH[0][0],k)/7)+1),hr=new Date().getHours();
 const nc=()=>{for(let i=0;i<7;i++){const d=addD(k,i),c=CLS.filter(x=>x[0]==dt(d).getDay()&&(i>0||x[1]>nowM())).sort((a,b)=>a[1]-b[1])[0];if(c)return fm(c[1])+' '+cn(c[3])+(i?' · '+(i==1?'tomorrow':d):'')}return '—'};
 const dl=S.tasks.filter(t=>!t.done).sort((a,b)=>score(b)-score(a)).slice(0,5),mid=dd(k,'2026-11-08'),fin=dd(k,'2026-12-27');
 const P=plan(k),done=P.filter(b=>b.t=='focus'&&b.done).length,tot=P.filter(b=>b.t=='focus').length;
 return`<h1>Good ${hr<12?'morning':hr<17?'afternoon':'evening'}, ${S.set.name}</h1><p class="mu">Fall 2026–27 · Week ${wk} · ${ph[1]} phase · ${new Date().toDateString()}</p>
 <div class="c now" style="margin:14px 0"><div class="mu">WHAT SHOULD I DO NOW?</div><div class="big">${n.t}</div><div>${n.d}</div><p>${n.r}</p>
 <div class="row">${n.b?`<button data-act="start" data-id="${n.b.id}">START FOCUS</button>`:''}<span class="mu">${n.next.slice(0,2).map((x,i)=>(i?'LATER: ':'NEXT: ')+x.title).join(' · ')}</span></div></div>
 <div class="g g4"><div class="c"><div class="mu">Focused today</div><div class="big">${(mins(k)/60).toFixed(1)}h</div>${bar(Math.min(100,mins(k)/S.set.cap/.6))}</div>
 <div class="c"><div class="mu">Plan progress</div><div class="big">${done}/${tot}</div></div><div class="c"><div class="mu">Next class</div><b>${nc()}</b></div>

 const A={start(){const b=plan(k).find(x=>x.id==id);startF(b.title,b.id,b.task,Math.min(60,b.e-b.s),b.cat)},
 tstart(){const t=S.tasks.find(x=>x.id==id);startF(t.title,null,t.id,Math.min(60,t.dur),COURSES.some(c=>c.id==t.cat)?'course':t.cat)},
 tg(){const t=S.tasks.find(x=>x.id==id);t.done=!t.done;toast(t.done?'Task completed':'Reopened')},tdel(){S.tasks=S.tasks.filter(x=>x.id!=id)},
 regen(){delete S.plans[k];toast('Plan regenerated')},bdone(){const b=plan(k).find(x=>x.id==id);b.done=!b.done},
 recover(){const P=plan(k),n=nowM(),miss=P.filter(b=>b.t=='focus'&&!b.done&&b.e<n);let c=0;miss.forEach(b=>{const t=S.tasks.find(x=>x.id==b.task);if(t&&t.imp<=3){t.due=addD(k,dt(addD(k,1)).getDay()>=4?(6-dt(k).getDay()+7)%7||1:2);c++}else if(t){t.dur=Math.max(30,Math.round(t.dur/2));t.due=addD(k,1)}b.done=true});toast(miss.length?'Recovery: '+c+' moved to weekend buffers, others split. Sleep untouched.':'Nothing missed so far')},
 weekplan(){let o='';for(let i=0;i<7;i++){const d=addD(k,i);delete S.plans[d];const p=plan(d);o+=dt(d).toDateString().slice(0,3)+' '+(p.filter(b=>b.t=='focus').reduce((s,b)=>s+b.e-b.s,0)/60).toFixed(1)+'h  '}toast('Week planned: '+o)},
 top3(){document.getElementById('t3').textContent=S.tasks.filter(t=>!t.done).sort((a,b)=>score(b)-score(a)).slice(0,3).map((t,i)=>(i+1)+'. '+t.title).join('  ·  ');return 1},
 prog(){},paper(){S.papers.read++;S.papers.pending=Math.max(0,S.papers.pending-1)},th(){S.thesis[id].d=!S.thesis[id].d},
 adel(){S.apps=S.apps.filter(x=>x.id!=id)},ff(){startF('Free focus',null,null,+id)},fp(){F.run=!F.run},fd(){finish();return 1},fx(){clearInterval(TM);F=null},
 hb(){const h=S.habits[id];h.days[k]=!h.days[k]},reset(){sheet('<h2>Reset all data?</h2><p class="mu">This permanently erases tasks, logs and progress on this device. Export a backup first if unsure.</p><div class="row"><button data-act="reset2">Erase everything</button><button class="s" data-act="close">Cancel</button></div>');return 1},
 reset2(){localStorage.removeItem('sos1');NOSAVE=1;location.reload();return 1},close(){closeSheet();return 1},
 exp(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='talukdar-backup-'+today()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),500);toast('Backup downloaded');return 1},
 imp(){$('#imf').click();return 1},imp2(){localStorage.setItem('sos1',window.PEND);NOSAVE=1;location.reload();return 1},
 qa(){closeSheet();({task(){go('tasks');setTimeout(()=>{const i=document.querySelector('#nt input');i&&i.focus()},60)},focus(){go('focus')},ielts(){qlog('Log IELTS practice','english')},workout(){qlog('Log workout','fit')},app(){go('career')},thesis(){qlog('Add thesis progress','thesis')}})[id]();return 1}};
 if(!A[a.dataset.act])return;const r=A[a.dataset.act]();save();if(r!=1||a.dataset.act=='top3'){if(a.dataset.act!='top3')draw()}});
document.addEventListener('change',e=>{const a=e.target.closest('[data-act]');if(!a)return;const v=a.value,id=a.dataset.id;
 if(a.dataset.act=='prog'){S.prog[id]=+v}else if(a.dataset.act=='ast'){const p=S.apps.find(x=>x.id==id);p.st=v;if(v=='Applied'&&!p.date)p.date=today()}
 else if(a.dataset.act=='theme')S.theme=v;else if(a.dataset.act=='gv')setP(id,+v);else if(a.dataset.act=='sv'){const tm=a.type=='time',val=tm?(+v.split(':')[0]*60+ +v.split(':')[1]):a.type=='number'?+v:v;if(id.startsWith('pr.'))S.set.pr[id.slice(3)]=val;else S.set[id]=val;delete S.plans[today()]}else return;save();draw()});
document.addEventListener('input',e=>{if(e.target.dataset.act=='prog'){S.prog[e.target.dataset.id]=+e.target.value;save()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 if(e.target.id=='nt')S.tasks.push({id:uid(),title:f.title,cat:f.cat,due:f.due,imp:+f.imp,dur:+f.dur,en:'M',done:false});
 if(e.target.id=='na')S.apps.push({id:uid(),co:f.co,pos:f.pos,url:f.url,st:'Wishlist',date:'',note:''});if(e.target.id=='ql'){const m=+f.m,c=f.cat;if(c=='fit'){(S.fit=S.fit||[]).push({d:today(),m});S.habits[4].days[today()]=1}else{S.log[today()]=S.log[today()]||{};S.log[today()][c]=(S.log[today()][c]||0)+m}closeSheet()}if(e.target.id=='nm')S.ielts.mocks.push({d:today(),b:+f.band});save();draw();toast('Added')});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeSheet();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();pal()}});
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!=V){V=v;draw()}});
if(!VIEWS[V])V='dash';draw();setInterval(()=>{if(V=='dash'&&!F)draw()},60000);
</script></body></html>
